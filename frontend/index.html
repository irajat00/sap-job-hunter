<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SAP Job Hunter</title>

  <!-- PWA: manifest + theme color (drives Android's install banner and auto-generated splash screen) -->
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <meta name="theme-color" content="#0B1E3A" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16.png" />

  <!-- iOS "Add to Home Screen" support. iOS/Safari has no beforeinstallprompt
       API or automatic install banner (unlike Android/Chrome) -- these tags
       are what make the manually-added home-screen icon open in standalone
       mode (no browser chrome) with the right icon and status bar style. -->
  <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SAP Jobs" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Inline (render-blocking, on purpose) so the splash paints on the
       very first frame with zero network round-trips -- this is the
       app's "splash screen": dark blue, app name, small spinner. It's
       removed the instant React mounts (see main.jsx). */
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0B1E3A;
      color: #ffffff;
      font-family: Inter, system-ui, sans-serif;
      z-index: 9999;
    }
    #app-splash__title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    #app-splash__spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #3884FF;
      animation: app-splash-spin 0.8s linear infinite;
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
    #app-splash.app-splash--hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-out;
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <div id="app-splash__spinner" aria-hidden="true"></div>
    <div id="app-splash__title">SAP Job Hunter</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
