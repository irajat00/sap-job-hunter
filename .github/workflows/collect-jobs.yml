# Runs the EXISTING, unmodified collector (backend/collectors/runner.py)
# every 15 minutes, entirely free, using GitHub Actions as the "always
# on" scheduler -- your laptop can be completely off.
#
# What this workflow does, each run:
#   1. Checks out the repo.
#   2. Restores backend/jobs.db from the GitHub Actions cache (see
#      "Why jobs.db is cached, not committed" below) -- on the very
#      first-ever run there's nothing to restore yet, which is fine:
#      migrate creates a fresh, empty database.
#   3. Installs backend/requirements.txt.
#   4. Runs `python -m app.migrate` (idempotent -- safe every time).
#   5. Runs `python -m collectors.runner --skip-expiry-check` -- the
#      exact same collector code you tested locally. It fetches jobs,
#      filters them, saves new ones to jobs.db, and sends an instant
#      Telegram notification for every NEW job, exactly as before.
#      (--skip-expiry-check skips the slow "check every stored job's
#      link is still alive" sweep here so a 15-minute run stays fast;
#      that full sweep still runs once/day in daily-summary.yml.)
#   6. Regenerates frontend/public/data/jobs.json (the static snapshot
#      the GitHub Pages frontend reads -- see backend/scripts/export_jobs_json.py).
#   7. Saves the updated jobs.db back to the cache, so the NEXT run
#      picks up where this one left off (this is what makes dedup and
#      "no duplicate notifications" work across runs).
#   8. Commits and pushes ONLY jobs.json to the repo, ONLY IF it
#      changed. jobs.db itself is NEVER committed -- see below. That
#      push also triggers deploy-pages.yml, so the live site updates
#      automatically after every collector run.
#
# Why jobs.db is cached, not committed to git:
# GitHub Actions runners are ephemeral -- nothing on disk survives
# between runs unless the workflow saves it somewhere. jobs.db is
# intentionally kept OUT of git entirely (see .gitignore) and instead
# persisted using the GitHub Actions cache (actions/cache), which is
# still 100% free and still "on GitHub", but doesn't bloat the git
# history with a binary file on every run. The restore step below uses
# a unique key per run (github.run_id) plus a `restore-keys` prefix so
# it always finds and restores the most recently saved jobs.db -- this
# is the standard, documented GitHub Actions pattern for "always want
# the latest version of some evolving state" (see actions/cache's docs
# on restore-keys). Caches are capped at 10GB total per repo and
# unused entries are evicted automatically (least-recently-used first,
# and anything untouched for 7+ days) -- no manual cleanup is needed
# for a SQLite file this size.
name: Collect SAP jobs

on:
  schedule:
    # GitHub Actions' documented minimum interval for scheduled
    # workflows is 5 minutes, but this project runs every 15 minutes
    # instead -- a deliberately calmer, simpler cadence for a
    # stable/production setup (still frequent enough that new postings
    # reach Telegram promptly). GitHub's scheduler is best-effort:
    # expect occasional delays of a few minutes during periods of high
    # platform load, especially right at the top of the hour. This is
    # a GitHub-wide limitation, not something this workflow can control.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab to test on demand

permissions:
  contents: write   # required so the workflow can commit jobs.json back to the repo

concurrency:
  group: collect-jobs
  cancel-in-progress: false   # never cancel a run that's mid-way through saving/notifying

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore jobs.db from cache (most recent run)
        uses: actions/cache/restore@v4
        with:
          path: backend/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database migration (idempotent)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./jobs.db
        run: python -m app.migrate

      - name: Run collector (fetch, filter, save, notify)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./jobs.db
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: ${{ vars.ADZUNA_COUNTRIES }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOB_MAX_AGE_DAYS: ${{ vars.JOB_MAX_AGE_DAYS }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m collectors.runner --skip-expiry-check

      - name: Regenerate static jobs.json for the frontend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./jobs.db
          JOB_MAX_AGE_DAYS: ${{ vars.JOB_MAX_AGE_DAYS }}
        run: python -m scripts.export_jobs_json

      - name: Save jobs.db to cache for the next run
        uses: actions/cache/save@v4
        with:
          path: backend/jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Commit and push jobs.json only (never jobs.db)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit (no new jobs this run)."
          else
            git commit -m "chore: update jobs.json $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
