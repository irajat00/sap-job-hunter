# Builds the EXISTING, unmodified frontend (frontend/src/**) and
# deploys it to GitHub Pages -- completely free, no server, no
# credit card. Triggered on every push to main (including the
# automatic commits collect-jobs.yml and daily-summary.yml make when
# new jobs are found), so the live site's job list refreshes
# automatically after every collector run, plus manual dispatch for
# testing.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; if a newer push comes in while a
# deploy is running, let the in-progress one finish rather than
# cancelling it mid-upload (cancel-in-progress: false), but drop any
# older *queued* runs in favor of the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (GitHub Pages project-site base path)
        working-directory: frontend
        # ${{ github.event.repository.name }} = your repo's name, e.g.
        # "ai-job-hunter" -> served at https://<you>.github.io/ai-job-hunter/
        # This must match vite.config.js's base path exactly, which it
        # does automatically since both derive from the same repo name.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
